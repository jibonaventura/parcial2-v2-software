<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuentes Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center py-8 px-4 sm:px-6 lg:px-8 selection:bg-red-100 selection:text-red-700">

    <!-- Contenedor -->
    <main class="w-full max-w-xl bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100 overflow-hidden transition-all">
        
        <!-- Header -->
        <header class="bg-gradient-to-r from-red-600 to-rose-600 px-6 py-7 text-white">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Mis Tareas</h1>
                    <p id="current-date" class="text-red-100 text-sm mt-1 capitalize"></p>
                </div>
                <div class="bg-white/15 p-3 rounded-xl backdrop-blur-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                    </svg>
                </div>
            </div>
        </header>

        <!-- Cuerpo -->
        <div class="p-6">
            
            <!-- Formulario para Agregar Tareas -->
            <form id="task-form" class="flex flex-col sm:flex-row gap-3 mb-6">
                <div class="relative flex-grow">
                    <input 
                        type="text" 
                        id="task-input" 
                        placeholder="¿Qué necesitas hacer hoy?" 
                        autocomplete="off"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent focus:bg-white transition-all"
                    >
                </div>
                <button 
                    type="submit" 
                    class="px-6 py-3 bg-red-600 hover:bg-red-700 active:bg-red-800 text-white font-medium rounded-xl shadow-sm shadow-red-200 flex items-center justify-center gap-2 transition-all cursor-pointer shrink-0"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                    </svg>
                    <span>Agregar</span>
                </button>
            </form>

            <!-- Mensaje de Alerta / Validación -->
            <div id="toast-message" class="hidden mb-4 px-4 py-3 rounded-xl text-sm font-medium bg-rose-50 text-rose-600 border border-rose-200 flex items-center gap-2 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                </svg>
                <span id="toast-text">Por favor, escribe una tarea válida.</span>
            </div>

            <!-- Filtro y Limpieza -->
            <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-4 border-b border-slate-100">
                <div class="flex gap-1 bg-slate-100 p-1 rounded-xl" role="group" aria-label="Filtrar tareas">
                    <button type="button" data-filter="all" class="filter-btn active px-3 py-1.5 text-xs font-semibold rounded-lg bg-white text-red-600 shadow-sm transition-all">
                        Todas
                    </button>
                    <button type="button" data-filter="pending" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition-all">
                        Pendientes
                    </button>
                    <button type="button" data-filter="completed" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition-all">
                        Completadas
                    </button>
                </div>

                <div class="flex items-center gap-3">
                    <span id="pending-counter" class="text-xs font-medium text-slate-500">0 pendientes</span>
                    <button 
                        type="button" 
                        id="clear-completed-btn" 
                        class="hidden text-xs font-medium text-slate-400 hover:text-rose-600 px-2.5 py-1.5 rounded-lg hover:bg-rose-50 transition-colors cursor-pointer"
                    >
                        Limpiar completadas
                    </button>
                </div>
            </div>

            <!-- Lista de Tareas -->
            <ul id="task-list" class="space-y-2.5 max-h-[50vh] overflow-y-auto pr-1">
            </ul>

            <!-- Estado Vacío -->
            <div id="empty-state" class="hidden py-12 text-center">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-100 text-slate-400 mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <h3 id="empty-title" class="text-slate-700 font-semibold text-base">No hay tareas pendientes</h3>
                <p id="empty-subtitle" class="text-slate-400 text-sm mt-1">Agrega una nueva tarea arriba para comenzar tu día.</p>
            </div>
        </div>
    </main>

<!-- Pie de página -->
<footer>
</footer>

<!-- Js -->
<script src="app.js"></script>
</body>
</html>
